spring:
  application:
    name: land-sales-backend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      demo:
        - docker

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}"

  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:PT2H}

  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:}

  demo:
    enabled: ${APP_DEMO_ENABLED:false}
    username: ${APP_DEMO_USERNAME:}